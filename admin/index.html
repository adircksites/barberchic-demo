<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Painel — Barberchic Fonseca</title>
  <link rel="icon" href="../img/logo.svg">
  <link rel="stylesheet" href="../admin/admin.css">
</head>
<body>
  <!-- Login -->
  <section id="login" class="login" hidden>
    <form class="login-card" id="f-login" novalidate>
      <img src="../img/logo.svg" alt="" class="login-logo">
      <h1>Área administrativa</h1>
      <div class="err" hidden></div>
      <div id="login-step1">
        <label>Usuário<input name="usuario" autocomplete="username" required></label>
        <label>Senha<input name="senha" type="password" autocomplete="current-password" required></label>
      </div>
      <div id="login-step2" hidden>
        <p class="muted">Digite o código de 6 dígitos do seu aplicativo autenticador (ou um código de recuperação).</p>
        <label>Código<input name="codigo" inputmode="numeric" autocomplete="one-time-code" class="code"></label>
      </div>
      <button class="btn primary block" type="submit">Entrar</button>
    </form>
  </section>

  <!-- App -->
  <div id="app" class="app" hidden>
    <aside class="side" id="side">
      <div class="side-brand"><img src="../img/logo.svg" alt=""><span>Barberchic</span></div>
      <nav id="menu">
        <a href="#painel" data-sec="painel">Resumo</a>
        <a href="#agenda" data-sec="agenda">Agenda</a>
        <a href="#clientes" data-sec="clientes">Clientes</a>
        <a href="#funcionarios" data-sec="funcionarios">Funcionários e escala</a>
        <a href="#servicos" data-sec="servicos">Serviços</a>
        <a href="#campanhas" data-sec="campanhas">Campanhas</a>
        <a href="#respostas" data-sec="respostas">Respostas <b class="badge" id="b-resp" hidden></b></a>
        <a href="#conferencias" data-sec="conferencias">Conferências <b class="badge" id="b-conf" hidden></b></a>
        <a href="#conexoes" data-sec="conexoes">Conexões</a>
        <a href="#relatorios" data-sec="relatorios">Relatórios</a>
        <a href="#logs" data-sec="logs">Logs</a>
        <a href="#config" data-sec="config">Configurações</a>
      </nav>
      <div class="side-foot"><span id="who"></span><button class="link" id="b-logout" type="button">Sair</button></div>
    </aside>
    <button class="side-toggle" id="side-toggle" aria-label="Menu">☰</button>
    <main class="main" id="main"></main>
  </div>

  <div class="modal" id="modal" hidden><div class="modal-box" id="modal-box"></div></div>
  <div class="toast" id="toast" hidden></div>
  <script src="../js/demo-api.js"></script>
  <script src="../admin/admin.js"></script>
</body>
</html>
